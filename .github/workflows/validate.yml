name: Validate

on:
  push:
    branches: [main, stable]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3_migration/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: v3_migration/backend
        run: npm ci --ignore-scripts

      - name: Test backend
        working-directory: v3_migration/backend
        run: npm test -- --runInBand --detectOpenHandles

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3_migration/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: v3_migration/frontend
        run: npm ci

      - name: Build frontend
        working-directory: v3_migration/frontend
        run: npm run build

      - name: Test frontend document contracts
        working-directory: v3_migration/frontend
        run: npm test